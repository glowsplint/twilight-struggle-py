<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>冷战热斗 · espionnage 棋谱播放器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%A2%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#14171c;--panel:#1e232b;--border:#333b47;--text:#d8dee6;--dim:#8b95a3;
--red:#e05656;--blue:#5a9bd8;--yellow:#e8c46a;--green:#7dbf7d;--purple:#b088d8;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;
font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);
border-bottom:1px solid var(--border);height:40px;flex:none}
#topbar .sep{color:var(--border)}
#banner{color:var(--yellow)}
#drop{flex:1;text-align:center;padding:8px;color:var(--dim);cursor:pointer}
#drop.over{background:#2f3a4a}
#player{display:none;align-items:center;gap:6px;padding:5px 12px;background:var(--panel);
border-bottom:1px solid var(--border);font-size:13px;flex:none}
#player button{background:#2a313c;color:var(--text);border:1px solid var(--border);
border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px}
#pl-label{color:var(--dim);white-space:nowrap;min-width:200px}
#pl-slider{flex:1;min-width:100px}
#tracks{display:flex;gap:10px;flex-wrap:wrap;padding:6px 12px;background:var(--panel);
border-bottom:1px solid var(--border);font-size:13px;flex:none}
.track.red{color:var(--red)}.track.blue{color:var(--blue)}
.track.defcon-warn{color:var(--red);font-weight:bold}
.vp-meter{position:relative;display:inline-block;width:110px;height:10px;margin-right:6px;
vertical-align:middle;background:#262c35;border:1px solid var(--border);border-radius:3px}
.vp-fill{position:absolute;top:0;bottom:0}
.vp-fill.red{background:var(--red)}.vp-fill.blue{background:var(--blue)}
.vp-cz{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--dim)}
.vp-cz::after{content:attr(title);position:absolute;left:50%;top:100%;
transform:translateX(-50%);font-size:10px;line-height:1.2;color:var(--dim)}
.defcon-sq{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;
margin-left:2px;border:1px solid var(--border);border-radius:2px;color:var(--dim);
font-weight:700;font-size:11px}
.defcon-sq.cur{color:var(--text);border-color:var(--yellow)}
.defcon-sq.hot{color:#ffe0e0;background:var(--red)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
#board-wrap{overflow-y:auto;padding:10px 12px}
#board{position:relative}
#map{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:4px}
.chip{position:absolute;display:flex;align-items:stretch;pointer-events:none;
padding-top:calc(14px*var(--map-scale,.61))}
.half{flex:1;display:flex;align-items:center;justify-content:center;padding:1px;min-width:0}
.tok{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
border:1px solid rgba(0,0,0,.55);border-radius:2px;font-weight:700;line-height:1}
.tok.us{background:#fff;color:#2d6ba8}.tok.us.ctl{background:#2d6ba8;color:#fff}
.tok.ussr{background:#fff;color:#c0392b}.tok.ussr.ctl{background:#c0392b;color:#fff}
.tok.zero{visibility:hidden}
.chip.zero{opacity:.5;outline:1px dashed var(--border)}
#dbg-layer{position:absolute;inset:0;pointer-events:none;display:none}
#dbg-layer.on{display:block}
.dbg{position:absolute;outline:1px solid #4dd0e1}
.dbg-label{position:absolute;left:0;top:0;transform:translateY(-100%);
font-size:10px;line-height:1.25;color:#00e5ff;background:rgba(0,0,0,.75);
padding:0 2px;white-space:nowrap}
#dbg{background:#2a313c;color:var(--text);border:1px solid var(--border);
border-radius:4px;padding:2px 10px;cursor:pointer;font-size:12px}
#dbg.on{border-color:var(--yellow);color:var(--yellow)}
#clist{margin-top:8px;font-size:12px;color:var(--dim)}
#clist h4{font-weight:normal;margin-bottom:4px}
.lchip{display:inline-block;background:rgba(20,23,28,.88);border:1px solid var(--border);
border-radius:3px;padding:1px 6px;margin:2px;font-size:12px}
#pl-delay{width:54px}
#right{display:flex;flex-direction:column;border-left:1px solid var(--border);min-height:0}
#saved-state{display:none;padding:8px 10px;border-bottom:1px solid var(--border);
background:var(--panel);font-size:12px;max-height:42vh;overflow-y:auto}
#saved-state.on{display:block}
.saved-title{color:var(--yellow);margin-bottom:5px}
.saved-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;
padding:2px 0;border-top:1px solid rgba(51,59,71,.45)}
.saved-label{color:var(--dim)}.saved-cards{overflow-wrap:anywhere}
#log-bar{display:flex;align-items:center;gap:8px;padding:4px 10px;
border-top:1px solid var(--border);background:var(--panel);font-size:12px;
color:var(--dim);flex:none}
#log-bar button{background:#2a313c;color:var(--text);border:1px solid var(--border);
border-radius:4px;padding:1px 8px;cursor:pointer;font-size:12px}
#log-scroll{flex:1;overflow-y:auto;padding:6px 10px;min-height:60px}
#log-scroll.collapsed{display:none}
#log{font-size:12px;line-height:18px}
.log-line{color:var(--dim)}
.log-line.hl{color:var(--yellow)}.log-line.ar{color:var(--text)}
.log-line.ev{color:var(--green)}
#toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);
background:#7a2b2b;color:#ffe9e9;border:1px solid #a34a4a;border-radius:6px;
padding:6px 14px;z-index:100;display:none}
</style>
</head>
<body>
<div id="topbar">
  <span>冷战热斗 · espionnage 棋谱播放器</span>
  <span class="sep">|</span>
  <span id="banner">请选择或拖入 .txt 棋谱文件</span>
  <button id="dbg" title="显示全部国家框 bbox 坐标（含 0/0 国家）">调试</button>
</div>
<div id="drop">点击选择或拖入 espionnage 格式 .txt 棋谱文件（纯本地解析，不上传）</div>
<div id="player">
  <button id="pl-first" title="第一步">⏮</button>
  <button id="pl-prev" title="上一步">◀</button>
  <button id="pl-toggle" title="播放/暂停">▶</button>
  <button id="pl-next" title="下一步">▶|</button>
  <span id="pl-label"></span>
  <input type="range" id="pl-slider" min="0" max="0" value="0">
  <label title="自动播放每步间隔（秒）">间隔
    <input type="number" id="pl-delay" min="0.1" max="60" step="0.1" value="1"> 秒/步
  </label>
  <label title="在版图上显示双方影响力均为 0 的国家">
    <input type="checkbox" id="show-zero"> 显示 0/0
  </label>
</div>
<div id="tracks">
  <span id="vp" class="track">
    <span class="vp-meter" title="VP 轨道：+为苏联领先（满分 ±20）">
      <span id="vp-fill" class="vp-fill"></span>
      <span class="vp-cz" title="EVEN">0</span>
    </span>
    <span id="vp-num"></span>
  </span>
  <span id="defcon" class="track">DEFCON <span class="defcon-sq" data-v="5" title="DEFCON 5">5</span><span class="defcon-sq" data-v="4" title="DEFCON 4">4</span><span class="defcon-sq" data-v="3" title="DEFCON 3">3</span><span class="defcon-sq" data-v="2" title="DEFCON 2">2</span><span class="defcon-sq" data-v="1" title="DEFCON 1＝核战">1</span><span id="defcon-num"></span></span>
  <span id="milops" class="track"></span>
  <span id="space" class="track"></span>
  <span id="turn" class="track"></span>
</div>
<main>
  <div id="board-wrap">
    <div id="board">
      <img id="map" alt="世界地图">
      <div id="chips"></div>
      <div id="dbg-layer"></div>
    </div>
    <div id="clist"></div>
  </div>
  <div id="right">
    <div id="saved-state"></div>
    <div id="log-bar"><span>对局日志</span><button id="log-toggle">收起</button></div>
    <div id="log-scroll"><div id="log"></div></div>
  </div>
</main>
<div id="toast"></div>

const RE_HEADLINE = /Turn (\d+), Headline Phase:/;

const RE_HANDICAP = /^Handicap influence: (.+)$/;
const RE_INFL = /(USSR|US) ([+-]\d+) in (.+?) \[(\d+)\]\[(\d+)\]/;
const RE_DEFCON = /DEFCON (?:degrades|improves) to (\d)/;
const RE_MILOPS = /(USSR|US) Military Ops to (\d)/;
const RE_SPACE = /(USSR|US) advances to (\d+) in the Space Race\.?/;
const RE_SCORE = /Score is (?:USSR |US )?([+-]?\d+|even)/;

function espScore(line) {
  const m = RE_SCORE.exec(line);
  if (!m) return null;
  let v = m[1];
  if (v === "even") return 0;
  if (line.includes("Score is US ") && !v.startsWith("-") && !v.startsWith("+")) return -parseInt(v, 10);
  return parseInt(v, 10);
}

function splitTsx(text) {
  text = text.replace(/\r\n?/g, "\n");
  const marker = "\n# TSX-BEGIN v1\n";
  const at = text.lastIndexOf(marker);
  if (at < 0) return {text, save: null};
  const lines = text.slice(at + marker.length).trimEnd().split("\n");
  if (lines.length < 2 || lines[lines.length - 1] !== "# TSX-END") {
    throw new Error("TSX 存档扩展块损坏");
  }
  let payload;
  if (lines[0].startsWith("# TSX-DATA ")) {
    payload = lines[0].slice("# TSX-DATA ".length);
  } else if (lines[0] === "# TSX-DATA" &&
             lines.slice(1, -1).every(line => line.startsWith("# "))) {
    payload = lines.slice(1, -1).map(line => line.slice(2)).join("\n");
  } else {
    throw new Error("TSX 存档扩展块损坏");
  }
  const save = JSON.parse(payload);
  if (save.format !== "ts-espionnage-save" || save.version !== 1) {
    throw new Error("不支持的 TSX 存档版本");
  }
  return {text: text.slice(0, at), save};
}

  const emit = () => {
    if (!curLabel) return;
    // card_zh 与 hvs/espionnage.py 的 step schema 对齐（网页播放器 pl-label 读它）
    steps.push({ label: curLabel, card: curCard,
                 card_zh: COUNTRY_DATA.CARD_ZH[curCard] || curCard || "",
                 text: curText.join("\n").trim(), state: snap() });
    curText = [];
  };
  const applyState = (line) => {
    let m = RE_INFL.exec(line);
    if (m) {
      const c = normCountry(m[3]);
      if (c) state.inf[c] = [parseInt(m[5], 10), parseInt(m[4], 10)]; // [US][USSR]→[USSR,US]
    }
    m = RE_DEFCON.exec(line);
    if (m) state.defcon = parseInt(m[1], 10);
    m = RE_MILOPS.exec(line);
    if (m) state.milops[m[1] === "USSR" ? 0 : 1] = parseInt(m[2], 10);
    m = RE_SPACE.exec(line);
    if (m) state.space[m[1] === "USSR" ? 0 : 1] = parseInt(m[2], 10);
    m = RE_SCORE.exec(line);
    if (m) {
      const v = espScore(line);
      if (v !== null) state.vp = v;
    }
  };

  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const mHead = RE_HEADLINE.exec(line);
    const mAr = RE_AR.exec(line);
    const mCln = RE_CLEANUP.exec(line);
    if (mHead || mAr || mCln) {
      emit();
      if (mHead) {
        state.turn = parseInt(mHead[1], 10); state.ar = 0; state.ar_side = "USSR";
        const hm = /Headlines\s+(.+?)\s*$/.exec(line);
        curLabel = "T" + state.turn + " 头条";
        curCard = hm ? normCard(hm[1]) : "";
      } else if (mAr) {
        state.turn = parseInt(mAr[1], 10); state.ar_side = mAr[2]; state.ar = parseInt(mAr[3], 10);
        const rest = mAr[4];
        const cm = /([^:]+):\s*(.+)/.exec(rest);
        curCard = normCard(cm ? cm[1] : rest);
        curLabel = "T" + state.turn + " " + state.ar_side + " AR" + state.ar;
      } else {
        curLabel = "T" + state.turn + " 结算";  // Cleanup 回合号不可靠，用上文
        curCard = "";
      }
      applyState(line);  // 决策行行内状态归新步（与 espionnage.py L249 顺序一致）
      curText.push(line);
      continue;
    }
    const mp = RE_PLAYER.exec(line) || RE_PLAYER2.exec(line);
    if (mp) meta[mp[2] === "USSR" ? "ussr" : "us"] = mp[1];
    const mh = RE_HANDICAP.exec(line);
    if (mh) meta.handicap = mh[1];
    applyState(line);
    if (!curLabel) curLabel = "开局布阵";
    curText.push(line);
  }
  emit();
  if (split.save) {
    const position = split.save.position || {};
    for (const name of Object.keys(state.inf)) state.inf[name] = [0, 0];
    for (const [name, influence] of Object.entries(position.map || {})) {
      if (state.inf[name] && Array.isArray(influence) && influence.length === 2) {
        state.inf[name] = [Number(influence[0]), Number(influence[1])];
      }
    }
    state.vp = Number(position.vp || 0);
    state.defcon = Number(position.defcon || 5);
    state.turn = Number(position.turn || 1);
    state.ar = Number(position.ar || 0);
    state.ar_side = String(position.ar_side || "USSR");
    state.milops = (position.milops || [0, 0]).slice();
    state.space = (position.space || [0, 0]).slice();
    const exact = snap();
    exact.savedHands = position.hands || null;
    exact.savedInput = position.input || null;
    exact.discard = (position.discard || []).slice();
    exact.removed = (position.removed || []).slice();
    exact.draw_count = Number(position.draw_count || 0);
    if (steps.length) steps[steps.length - 1].state = exact;
    else steps.push({label: "存档局面", card: "", card_zh: "", text: "", state: exact});
    meta.save_version = split.save.version;
  }
  return { meta, steps, save: split.save };
}

// ---------- 渲染与播放器 ----------
let DATA = null, CUR = 0, PLAYING = false, TIMER = null, SHOW_ZERO = false;
let DBG = false;
const $ = id => document.getElementById(id);

function renderTracks(st) {
  const vp = $("vp");
  vp.className = "track ";
  const num = $("vp-num");
  num.textContent = "VP " + (st.vp >= 0 ? "+" : "") + st.vp + " " +
    (st.vp > 0 ? "苏联领先" : st.vp < 0 ? "美国领先" : "持平");
  num.className = st.vp > 0 ? "red" : st.vp < 0 ? "blue" : "";
  const fill = $("vp-fill");
  const pct = Math.min(50, Math.abs(st.vp) / 20 * 50);  // 满分 ±20（与网页版同算法）
  fill.className = "vp-fill " + (st.vp >= 0 ? "red" : "blue");
  fill.style.left = st.vp >= 0 ? "50%" : (50 - pct) + "%";
  fill.style.right = st.vp >= 0 ? (50 - pct) + "%" : "50%";
  const def = $("defcon");
  def.className = "track" + (st.defcon <= 2 ? " defcon-warn" : "");  // 与网页版同名
  for (const sq of def.querySelectorAll(".defcon-sq")) {
    const v = Number(sq.dataset.v);
    sq.classList.toggle("cur", v === st.defcon);
    sq.classList.toggle("hot", v <= st.defcon && st.defcon <= 2);
  }
  $("defcon-num").textContent = " " + st.defcon;
  $("milops").textContent = "MILOPS 苏" + st.milops[0] + " 美" + st.milops[1];
  $("space").textContent = "太空 苏" + st.space[0] + " 美" + st.space[1];
  const as = st.ar_side === "USSR" ? "苏联行动" : st.ar_side === "US" ? "美国行动" : st.ar_side;
  $("turn").textContent = "第" + st.turn + "回合 " +
    (st.ar === 0 ? "头条" : "AR" + st.ar) + " " + as;
}

function chipText(c) {
  // 左美右苏（官方/人类棋谱惯例）；c.inf = [USSR, US]
  // 颜色方案：控制方自己的影响力=彩底白字（蓝=美、红=苏）；
  // 未控制的一方（含对方影响力）=白底彩字（蓝=美、红=苏）
  // 控制判定（规则书 2.1.7）：影响力领先对方 ≥ 国家稳定度（c.st）
  const st = c.st || 0;
  const us = c.inf[1], ussr = c.inf[0];
  const usCtl = st > 0 && us - ussr >= st;
  const ussrCtl = st > 0 && ussr - us >= st;
  return '<span class="half"><span class="tok us' + (usCtl ? " ctl" : "") +
         (us ? "" : " zero") + '">' + us + '</span></span>' +
         '<span class="half"><span class="tok ussr' + (ussrCtl ? " ctl" : "") +
         (ussr ? "" : " zero") + '">' + ussr + '</span></span>';
}

function updateMapScale() {
  const img = document.getElementById("map");
  const w = img && img.clientWidth;
  if (w > 0) {  // 图未加载完时不动（保持回退值，补偿不归零）
    document.documentElement.style.setProperty("--map-scale", (w / MAP_W).toFixed(4));
  }
}

// DOM 池化（与网页版 app.js setChip 同款算法：name→元素复用，步进不闪烁）
const CHIP_POOL = new Map();
let LAST_SEEN = null;
function setChipSt(c) {
  let d = CHIP_POOL.get(c.name);
  if (!d) {
    d = document.createElement("div");
    CHIP_POOL.set(c.name, d);
    $("chips").appendChild(d);
  }
  d.className = "chip";  // 战场国不额外标记：官方框表头底色自带区分
  // 精准命中官方框：bbox 定位 + 尺寸随地图缩放（--map-scale）
  d.style.left = (c.box[0] / MAP_W * 100) + "%";
  d.style.top = (c.box[1] / MAP_H * 100) + "%";
  // calc 绑定 --map-scale：resize 只随 CSS 变量重算（与网页版 placeChip 同款）
  const w = c.box[2] - c.box[0], h = c.box[3] - c.box[1];
  d.style.width = "calc(" + w + "px * var(--map-scale,.61))";
  d.style.height = "calc(" + h + "px * var(--map-scale,.61))";
  d.style.fontSize = "max(7px, calc(" + (h * 0.45).toFixed(2) +
    "px * var(--map-scale,.61)))";
  d.innerHTML = chipText(c);  // 国名隐藏：官方框自身带名
  d.title = c.zh + (c.bg ? "（战场国）" : "") + " " + c.inf[1] + "/" + c.inf[0];
}

function renderBoard(st) {
  updateMapScale();
  const chips = $("chips"), clist = $("clist");
  clist.textContent = "";
  const seen = new Set();
  const noXy = [];
  for (const region of Object.keys(st.map)) {
    for (const c of st.map[region]) {
      if (c.inf[0] >= 999 || c.inf[1] >= 999) continue;  // 超级大国标记
      if (!SHOW_ZERO && c.inf[0] === 0 && c.inf[1] === 0) continue;  // 0/0 由开关控制
      if (c.box) {
        seen.add(c.name);
        setChipSt(c);
      } else {
        noXy.push(c);
      }
    }
  }
  // 清理上一步消失的国家（0/0 开关关闭时同时生效）
  if (LAST_SEEN) {
    for (const n of LAST_SEEN) {
      if (!seen.has(n)) {
        const el = CHIP_POOL.get(n);
        if (el) el.remove();
        CHIP_POOL.delete(n);
      }
    }
  }
  LAST_SEEN = seen;
  if (noXy.length) {
    const h = document.createElement("h4");
    h.textContent = "◆ 其他国家";
    clist.appendChild(h);
    for (const c of noXy) {
      const d = document.createElement("span");
      d.className = "lchip";
      d.innerHTML = c.zh + " " + chipText(c);
      clist.appendChild(d);
    }
  }
}

// ---------- 调试模式：全部国家框 bbox 坐标 overlay（含 0/0） ----------
// 与网页客户端调试视图同步：青框描边 + 上缘标签 `中文名 [x0,y0,x1,y1]`。
// 尺寸用 calc(px * --map-scale) —— resize 时只随 CSS 变量重算，不失准。
function renderDebugOverlay() {
  const layer = $("dbg-layer");
  layer.textContent = "";
  for (const [name, c] of Object.entries(COUNTRY_DATA.countries)) {
    if (!c.box) continue;
    const d = document.createElement("div");
    d.className = "dbg";
    d.style.left = (c.box[0] / MAP_W * 100) + "%";
    d.style.top = (c.box[1] / MAP_H * 100) + "%";
    d.style.width = "calc(" + (c.box[2] - c.box[0]) + "px * var(--map-scale,.61))";
    d.style.height = "calc(" + (c.box[3] - c.box[1]) + "px * var(--map-scale,.61))";
    const lab = document.createElement("div");
    lab.className = "dbg-label";
    lab.textContent = (c.zh || name) + " [" + c.box.join(",") + "]";
    d.appendChild(lab);
    layer.appendChild(d);
  }
}

const LOG_LIMIT = 500;
function logLinesFor(i) {
  // 累积日志：0..i 所有步的文本（回退/前进都一致），上限 LOG_LIMIT 行
  const out = [];
  for (let k = 0; k <= i && out.length < LOG_LIMIT; k++) {
    const s = DATA.steps[k];
    for (const line of (s.text || "").split("\n")) {
      out.push(line);
      if (out.length >= LOG_LIMIT) break;
    }
  }
  return out;
}

function renderLog(i) {
  const el = $("log");
  el.textContent = "";
  for (const line of logLinesFor(i)) {
    const d = document.createElement("div");
    let cls = "log-line";
    if (line.startsWith("[") || line.includes("Headline")) cls += " hl";
    else if (line.startsWith("Turn ") && (line.includes(" AR") || line.includes("Cleanup"))) cls += " ar";
    else if (line.startsWith("Event:") || line.includes("VP.")) cls += " ev";
    d.className = cls;
    d.textContent = line;
    el.appendChild(d);
  }
  $("log-scroll").scrollTop = $("log-scroll").scrollHeight;
}

function cardNames(cards) {
  return (cards || []).map(name => COUNTRY_DATA.CARD_ZH[name] || name).join("、") || "无";
}

function renderSavedState(st) {
  const panel = $("saved-state");
  const hands = st.savedHands;
  const hasData = hands || (st.discard && st.discard.length) ||
    (st.removed && st.removed.length) || (DATA.save && DATA.save.replay);
  panel.classList.toggle("on", !!hasData);
  panel.textContent = "";
  if (!hasData) return;
  const title = document.createElement("div");
  title.className = "saved-title";
  title.textContent = "TSX 存档局面";
  panel.appendChild(title);
  const rows = [];
  if (DATA.save && DATA.save.replay) rows.push(["随机种子", String(DATA.save.replay.seed)]);
  if (hands) {
    rows.push(["苏联手牌", cardNames(hands.USSR)]);
    rows.push(["美国手牌", cardNames(hands.US)]);
  }
  if (st.savedInput) {
    const input = st.savedInput;
    rows.push(["当前决策", (input.side || "") + " · " +
      (input.type || "") + (input.prompt ? " · " + input.prompt : "")]);
    if (Array.isArray(input.options)) {
      rows.push(["合法选项", input.options.join("、") || "无"]);
    } else if (input.options_redacted) {
      rows.push(["合法选项", "已隐藏（未保存私有卡牌）"]);
    }
  }
  rows.push(["弃牌堆", cardNames(st.discard)]);
  rows.push(["移除区", cardNames(st.removed)]);
  rows.push(["抽牌堆", String(st.draw_count || 0) + " 张"]);
  for (const [label, value] of rows) {
    const row = document.createElement("div");
    row.className = "saved-row";
    const lab = document.createElement("span");
    lab.className = "saved-label";
    lab.textContent = label;
    const content = document.createElement("span");
    content.className = "saved-cards";
    content.textContent = value;
    row.appendChild(lab);
    row.appendChild(content);
    panel.appendChild(row);
  }
}

function renderStep(i) {
  const step = DATA.steps[Math.max(0, Math.min(DATA.steps.length - 1, i))];
  CUR = DATA.steps.indexOf(step);
  renderTracks(step.state);
  renderBoard(step.state);
  renderSavedState(step.state);
  renderLog(CUR);
  $("pl-slider").value = String(CUR);
  const card = step.card ? " · " + (step.card_zh ||
    COUNTRY_DATA.CARD_ZH[step.card] || step.card) : "";
  $("pl-label").textContent = (CUR + 1) + "/" + DATA.steps.length +
    " " + step.label + card;
}

function setPlaying(on) {
  PLAYING = on;
  $("pl-toggle").textContent = on ? "⏸" : "▶";
  clearInterval(TIMER);
  if (on) {  // 间隔可配（播放栏"间隔"输入，默认 1 秒/步）
    const d = (parseFloat($("pl-delay").value) || 1) * 1000;
    TIMER = setInterval(() => {
      if (CUR >= DATA.steps.length - 1) return setPlaying(false);
      renderStep(CUR + 1);
    }, d);
  }
}

function loadText(text, name) {
  DATA = parseEspionnage(text);
  if (!DATA.steps.length) { toast("解析失败：未识别到棋谱内容"); return; }
  CUR = 0;
  const m = DATA.meta;
  $("banner").textContent = name + "：" +
    (m.ussr || "?") + " vs " + (m.us || "?") +
    (m.handicap ? "（" + m.handicap + "）" : "") + " · " + DATA.steps.length + " 步" +
    (DATA.save && DATA.save.replay ? " · seed " + DATA.save.replay.seed : "");
  $("drop").style.display = "none";
  $("player").style.display = "flex";
  $("pl-slider").max = String(DATA.steps.length - 1);
  renderStep(0);
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 3000);
}

// ---------- 事件 ----------
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = ".txt,.tsg,text/plain";
fileInput.style.display = "none";
document.body.appendChild(fileInput);

const drop = $("drop");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) readFile(fileInput.files[0]);
  fileInput.value = "";
});
function readFile(f) {
  const reader = new FileReader();
  reader.onload = () => loadText(String(reader.result), f.name);
  reader.onerror = () => toast("读取文件失败");
  reader.readAsText(f, "utf-8");
}
$("pl-first").addEventListener("click", () => { setPlaying(false); renderStep(0); });
$("pl-prev").addEventListener("click", () => { setPlaying(false); renderStep(CUR - 1); });
$("pl-toggle").addEventListener("click", () => setPlaying(!PLAYING));
$("pl-next").addEventListener("click", () => { setPlaying(false); renderStep(CUR + 1); });
$("pl-slider").addEventListener("input", e => {
  setPlaying(false);
  renderStep(parseInt(e.target.value, 10));
});
// 日志折叠（收起后只留标题栏，不随步刷屏清空）
$("log-toggle").addEventListener("click", () => {
  const collapsed = $("log-scroll").classList.toggle("collapsed");
  $("log-toggle").textContent = collapsed ? "展开" : "收起";
});
// 显示 0/0 开关（默认隐藏）
$("show-zero").addEventListener("change", e => {
  SHOW_ZERO = e.target.checked;
  if (DATA) renderStep(CUR);
});
// 调试模式开关：坐标 overlay 与棋谱渲染共存（#dbg-layer 在 #chips 之后，顶层）
$("dbg").addEventListener("click", () => {
  DBG = !DBG;
  $("dbg").classList.toggle("on", DBG);
  $("dbg-layer").classList.toggle("on", DBG);
  if (DBG) renderDebugOverlay();
});
// chip 补偿比例：窗口缩放与地图加载完成后同步（--map-scale）
window.addEventListener("resize", updateMapScale);
document.getElementById("map").addEventListener("load", updateMapScale);

</script>
