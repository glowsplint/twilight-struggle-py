[pytest]
# 2026-08-17: %LOCALAPPDATA%\Temp\pytest-of-2ndplayer 的 ACL 被破坏
# (连枚举/读 ACL 都被 WinError 5 拒绝), 所有会话的 pytest 默认 basetemp
# 都撞它而报 PermissionError。把 basetemp 指到项目内, 不再依赖系统 Temp。
# 约定从项目根运行 pytest (CLAUDE.md 的命令均如此)。
addopts = --basetemp=.pytest_tmp
markers =
    slow: 需要真 checkpoint/长耗时的人机对战整局测试 (需 HVS_CHECKPOINT)
