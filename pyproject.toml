[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v -m 'not slow'"
markers = [
    "slow: long-running integration tests (run with: pytest -m slow)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "ai/*", "frontend/*", "train.py", "evaluate.py"]

[tool.coverage.report]
fail_under = 20
show_missing = true
